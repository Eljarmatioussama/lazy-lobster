services:

  app:
    build: .
    container_name: my-php-app
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_DATABASE: my_database
      DB_USERNAME: appuser
      DB_PASSWORD: password


  db:
    image: mysql:8.4
    container_name: mysql-db
    restart: always
    # App targets MySQL 5.x/MariaDB defaults: its queries break under
    # ONLY_FULL_GROUP_BY, and its INSERTs omit NOT NULL columns that have no
    # default (e.g. we_day1.eorder), which STRICT_TRANS_TABLES rejects.
    command: --sql-mode=NO_ENGINE_SUBSTITUTION
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: my_database
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Initialize a new local database with the supplied schema and yoga extension.
      - ../database.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./migrations/001_add_yoga_tables.sql:/docker-entrypoint-initdb.d/002_yoga.sql:ro
      - ./migrations/002_add_app_users.sql:/docker-entrypoint-initdb.d/003_app_users.sql:ro
      - ./migrations/003_add_workout_intro_video.sql:/docker-entrypoint-initdb.d/004_workout_intro_video.sql:ro
      - ./migrations/004_add_exercise_video_duration.sql:/docker-entrypoint-initdb.d/005_exercise_video_duration.sql:ro


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db


volumes:
  mysql_data:
