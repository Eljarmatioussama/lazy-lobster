; Controllers reference SITE_URL in their logged-out branch but only require
; config.php inside the logged-in branch, so load it ahead of every request.
auto_prepend_file = /var/www/html/admin/config.php

; Controllers emit HTML before their post-save header('Location: ...') calls,
; which only works with buffering on, as in php.ini-production. The base image
; ships no php.ini, so this defaults to Off and every redirect is dropped.
output_buffering = 4096
